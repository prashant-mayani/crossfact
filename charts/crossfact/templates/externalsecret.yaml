{{- if and .Values.secrets.externalSecret.enabled (not .Values.secrets.existingSecret) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossfact-secrets
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.storeRef.kind }}
    name: {{ .Values.secrets.externalSecret.storeRef.name }}
  target:
    name: crossfact-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range concat .Values.secrets.externalSecret.keys .Values.secrets.externalSecret.extraKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
{{- end }}
