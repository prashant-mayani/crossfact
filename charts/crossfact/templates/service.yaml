apiVersion: v1
kind: Service
metadata:
  name: crossfact
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "crossfact.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    # The tunnel targets port 80 only; metrics stay off the public path.
    - {name: http, port: 80, targetPort: http}
    - {name: metrics, port: 9095, targetPort: metrics}
