apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossfact
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "crossfact.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "crossfact.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: crossfact
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.restore.enabled }}
      # First step of every app pod: if the volume has no database (a rebuild),
      # restore the latest backup. A no-op otherwise. If a backup exists but
      # can't be read, this fails and keeps failing, so the app never starts on
      # an empty database that the next backup would then save over the real one.
      initContainers:
        - name: restore
          command: [python, scripts/maintain.py, restore]
          {{- include "crossfact.jobContainer" . | nindent 10 }}
      {{- end }}
      containers:
        - name: crossfact
          image: {{ include "crossfact.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9095}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: CROSSFACT_CONFIG
              value: /etc/crossfact/config.yaml
            - name: CROSSFACT_PROVIDERS
              value: /etc/crossfact/providers.yaml
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/crossfact, readOnly: true}
            - {name: secrets, mountPath: /var/run/secrets/crossfact, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "crossfact.volumes" . | nindent 8 }}
        - name: secrets
          secret:
            secretName: {{ include "crossfact.secretName" . }}
            defaultMode: 0440
        {{- if .Values.restore.enabled }}
        {{- include "crossfact.backupKeyVolume" . | nindent 8 }}
        {{- end }}
