{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crossfact-backup
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "crossfact.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          {{- include "crossfact.jobPod" . | nindent 10 }}
          containers:
            - name: backup
              command: [python, scripts/maintain.py, daily]
              {{- include "crossfact.jobContainer" . | nindent 14 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crossfact-backup-verify
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.verifySchedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "crossfact.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup-verify
        spec:
          {{- include "crossfact.jobPod" . | nindent 10 }}
          containers:
            - name: verify
              command: [python, scripts/maintain.py, verify]
              {{- include "crossfact.jobContainer" . | nindent 14 }}
{{- end }}
