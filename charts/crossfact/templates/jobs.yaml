{{- if .Values.restore.enabled }}
# Runs on every sync before the app (wave -1). A no-op unless the volume is
# empty, which after a rebuild it is: then it pulls the latest backup.
apiVersion: batch/v1
kind: Job
metadata:
  name: crossfact-restore
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "crossfact.selector" . | nindent 8 }}
        app.kubernetes.io/component: restore
        crossfact.io/imds: "true"
    spec:
      {{- include "crossfact.jobPod" . | nindent 6 }}
      containers:
        - name: restore
          command: [python, scripts/maintain.py, restore]
          {{- include "crossfact.jobContainer" . | nindent 10 }}
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crossfact-backup
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "crossfact.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup
            crossfact.io/imds: "true"
        spec:
          {{- include "crossfact.jobPod" . | nindent 10 }}
          containers:
            - name: backup
              command: [python, scripts/maintain.py, daily]
              {{- include "crossfact.jobContainer" . | nindent 14 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crossfact-backup-verify
  labels:
    {{- include "crossfact.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.verifySchedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "crossfact.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup-verify
            crossfact.io/imds: "true"
        spec:
          {{- include "crossfact.jobPod" . | nindent 10 }}
          containers:
            - name: verify
              command: [python, scripts/maintain.py, verify]
              {{- include "crossfact.jobContainer" . | nindent 14 }}
{{- end }}
