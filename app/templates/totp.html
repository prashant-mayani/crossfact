{% extends "base.html" %}
{% block title %}Two-factor code{% endblock %}
{% block mainclass %}center{% endblock %}
{% block content %}
<div class="card auth">
  <div class="brand big"><span class="glyph">◇</span> Crossfact</div>
  <p class="sub">Enter the 6-digit code from your authenticator app.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/totp">
    <label>Code<input name="code" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" required autofocus></label>
    <button class="primary">Verify</button>
  </form>
</div>
{% endblock %}
