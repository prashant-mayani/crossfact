# Every change: lint, tests, chart validation (kubeconform + promtool SLO tests),
# secret scanning, dependency and config scanning.
# Main only: native arm64 image build -> Trivy gate -> keyless cosign signature +
# SBOM attestation -> promote the signed digest to the private deploy repo, where
# Argo CD picks it up. The cluster's admission controller refuses unsigned images.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  PROMETHEUS_VERSION: 3.15.1
  PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - name: Workflow lint
        run: pip install actionlint-py==1.7.12.25 && actionlint
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: {dockerfile: Dockerfile, config: .hadolint.yaml}

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - name: The pinned Claude Code CLI still takes our flags and reads the token
        # Installed with the same Node image as the Dockerfile's build stage; only the
        # native binary comes out. The check never reaches the internet (localhost proxy).
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/image:/src:ro" -v "$RUNNER_TEMP:/out" -w /tmp node:22-bookworm-slim \
            sh -c 'cp /src/package.json /src/package-lock.json . && npm ci --omit=dev --no-audit --no-fund >/dev/null \
                   && cp node_modules/@anthropic-ai/claude-code/bin/claude.exe /out/claude'
          python scripts/check_claude_cli.py --bin "$RUNNER_TEMP/claude"

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: {version: v4.3.1}
      - name: Install kubeconform and promtool (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform
          curl -sSfLo prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prom.tgz" | sha256sum -c -
          tar -xzf prom.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Render, validate schemas, unit-test SLO alerts
        run: charts/crossfact/tests/render.sh
      - name: Dashboards are regenerated from code
        run: |
          python3 charts/crossfact/dashboards/generate.py
          git diff --exit-code charts/crossfact/dashboards/

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # SARIF upload to the Security tab (free on public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Secret scan of the commits in this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          cd "$GITHUB_WORKSPACE"
          if [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range="${BASE}..${GITHUB_SHA}"
          else
            range="--all"   # first push or manual run: whole history
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="$range" .
      - name: Dependency vulnerabilities (Python + npm lockfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-deps.sarif
      - name: Misconfiguration scan (Dockerfile, Helm chart)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-deps.sarif') != ''
        with: {sarif_file: trivy-deps.sarif, category: trivy-deps}

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, chart, security]
    runs-on: ubuntu-24.04-arm   # native arm64: free 4-vCPU runners for public repositories
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing via GitHub's OIDC token
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The CLI in the image still reads the token (no network)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: docker run --rm --network none --entrypoint python "$REF" scripts/check_claude_cli.py
      - name: The measurement harness in the image starts (the nightly CronJob runs it)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: docker run --rm --network none --entrypoint python "$REF" -m bench --help
      - name: Gate on fixable critical CVEs before signing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest (keyless)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

  promote:
    needs: build
    if: vars.DEPLOY_REPO != ''
    runs-on: ubuntu-24.04
    environment: production    # holds DEPLOY_REPO_TOKEN; add required reviewers here if you want a gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
      - name: Pin the signed digest and chart revision in GitOps
        working-directory: deploy
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          SHORT: ${{ github.sha }}
        run: |
          set -euo pipefail
          app=gitops/apps/crossfact.yaml
          yq -i '.spec.source.targetRevision = strenv(GITHUB_SHA) |
                 .spec.source.helm.valuesObject.image.digest = strenv(DIGEST)' "$app"
          git config user.name "crossfact-ci"
          git config user.email "crossfact-ci@users.noreply.github.com"
          git add "$app"
          git diff --cached --quiet && { echo "already deployed"; exit 0; }
          git commit -m "deploy crossfact ${SHORT:0:12} (${DIGEST:7:12})"
          git push
