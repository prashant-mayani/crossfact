version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: npm          # Claude Code, baked into the image (CI checks each bump still reads the token)
    directory: /image
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
