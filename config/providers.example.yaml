# Crossfact provider registry: the single source of truth for every model the UI
# offers, how each provider is called, and how failures are handled.
#
# Adding a model = one line under its provider. Adding a provider that speaks the
# OpenAI chat-completions protocol = one block + one secret in Vault. Restart
# (or redeploy) to pick up changes. See docs/OPERATIONS.md, "Add a model".
#
# kind: claude_cli | gemini_api | gemini_cli | openai
# trains_on_data: shown in the UI so users know which voices may train on prompts.
#
# Per-provider resilience knobs (all optional; defaults in app/providers.py):
#   timeout_s           per-attempt timeout
#   retry               {max_attempts, base_delay_s, max_delay_s}  full-jitter backoff
#   circuit             {failure_threshold, cooldown_s, max_cooldown_s}  per provider/model

pipeline:
  max_debate_rounds: 3
  run_deadline_s: 600          # whole-run budget; the chart sets terminationGracePeriodSeconds above it
  reserve_judge_s: 90          # time kept back for the judge when deciding on another debate round
  reserve_merge_s: 60          # time kept back for the final merge
  straggler_grace_s: 150       # once one side has answered, how long to wait for the other before going on without it
  history_char_budget: 24000

  # Comparator and merge are extraction tasks, not reasoning: cheap, fast, thinking minimal.
  utility: {provider: gemini, model: gemini-3.5-flash-lite, effort: "off"}
  utility_fallbacks:
    - {provider: gemini, model: gemini-3.8-flash, effort: low}
    - {provider: claude, model: haiku, effort: low}

  # Judge for conflicts that survive debate. A third provider is the best judge
  # (it didn't argue either side); the prompt is anonymized either way.
  judge: {provider: gemini, model: gemini-3.8-flash, effort: high}
  judge_fallbacks:
    - {provider: claude, model: sonnet, effort: high}

  # Substitutes for a side whose model fails (after its own retries). A run
  # answered by a substitute is still two-model, and the UI says who stood in.
  fallbacks:
    gemini/gemini-3.8-flash: [{model: gemini-3.6-flash}, {model: gemini-3.5-flash-lite}]
    gemini/gemini-4-argon: [{model: gemini-3.8-flash}]
    claude/opus: [{model: sonnet}]

defaults:
  side_a: {provider: claude, model: sonnet, effort: medium}
  side_b: {provider: gemini, model: gemini-3.8-flash, effort: medium}

providers:
  claude:
    label: Claude
    kind: claude_cli
    secret: claude_oauth_token          # from `claude setup-token`; uses your Pro/Max plan
    trains_on_data: false
    enabled: true
    timeout_s: 300
    retry: {max_attempts: 2, base_delay_s: 3, max_delay_s: 30}
    circuit: {failure_threshold: 3, cooldown_s: 120, max_cooldown_s: 900}
    models:
      - {id: haiku,  label: "Claude Haiku (fast)"}
      - {id: sonnet, label: "Claude Sonnet"}
      - {id: opus,   label: "Claude Opus (Max plans)"}
      - {id: fable,  label: "Claude Fable (if your plan includes it)"}

  gemini:
    label: Gemini
    kind: gemini_api
    secret: gemini_api_key              # aistudio.google.com; free tier
    trains_on_data: true                # the free API tier may use prompts to improve products
    enabled: true
    timeout_s: 180
    retry: {max_attempts: 3, base_delay_s: 1.5, max_delay_s: 30}
    circuit: {failure_threshold: 3, cooldown_s: 60, max_cooldown_s: 600}
    # thinking_levels: the levels a model accepts; effort is clamped to the nearest one.
    models:
      - {id: gemini-3.8-flash,      label: "Gemini 3.8 Flash",      thinking_levels: [low, medium, high]}
      - {id: gemini-3.6-flash,      label: "Gemini 3.6 Flash",      thinking_levels: [minimal, low, medium, high]}
      - {id: gemini-3.5-flash-lite, label: "Gemini 3.5 Flash-Lite", thinking_levels: [minimal, low, medium, high]}
      - {id: gemini-4-argon,        label: "Gemini 4 Argon (check your AI Studio limits)", thinking_levels: [low, medium, high]}

  gemini_cli:
    label: Gemini CLI
    kind: gemini_cli
    secret: null                        # OAuth login done once inside the pod (docs/OPERATIONS.md)
    trains_on_data: true
    enabled: false
    timeout_s: 300
    models:
      - {id: gemini-3.8-flash, label: "Gemini 3.8 Flash via CLI"}

  # Optional free third voices. Model IDs change often: confirm them in each
  # provider's console before enabling, and add the key to Vault.
  groq:
    label: Groq
    kind: openai
    base_url: https://api.groq.com/openai/v1
    secret: groq_api_key
    trains_on_data: false
    supports_reasoning_effort: true
    enabled: false
    timeout_s: 90
    models:
      - {id: openai/gpt-oss-120b, label: "GPT-OSS 120B (Groq)"}

  openrouter:
    label: OpenRouter
    kind: openai
    base_url: https://openrouter.ai/api/v1
    secret: openrouter_api_key
    trains_on_data: false
    enabled: false
    timeout_s: 120
    models:
      - {id: "deepseek/deepseek-r1:free", label: "DeepSeek R1 (free)"}

  cerebras:
    label: Cerebras
    kind: openai
    base_url: https://api.cerebras.ai/v1
    secret: cerebras_api_key
    trains_on_data: false
    enabled: false
    timeout_s: 90
    models:
      - {id: gpt-oss-120b, label: "GPT-OSS 120B (Cerebras)"}
