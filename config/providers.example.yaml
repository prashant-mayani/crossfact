# Crossfact provider registry: the single source of truth for every model the UI
# offers, how each provider is called, and how failures are handled.
#
# Adding a model = one line under its provider. Adding a provider that speaks the
# OpenAI chat-completions protocol = one block + one secret in Vault. Restart
# (or redeploy) to pick up changes. See docs/OPERATIONS.md, "Add a model".
#
# kind: claude_cli | gemini_api | openai
# trains_on_data: shown in the UI so you know which voices may train on prompts.
# A provider whose key isn't set is skipped in every fallback chain and shown as
# "key missing"; nothing else breaks.
#
# Per-provider resilience knobs (all optional; defaults in app/providers.py):
#   timeout_s           per-attempt timeout
#   retry               {max_attempts, base_delay_s, max_delay_s}  full-jitter backoff
#   circuit             {failure_threshold, cooldown_s, max_cooldown_s}  per provider/model
# openai kind only:
#   api                 chat (default: /chat/completions) | responses (/responses)
#   base_url            may hold {placeholders} from config provider_vars (not secrets)
#   supports_reasoning_effort, reasoning_efforts  the levels the model takes; effort is clamped

pipeline:
  max_debate_rounds: 3
  run_deadline_s: 600          # whole-run budget; the chart sets terminationGracePeriodSeconds above it
  reserve_judge_s: 90          # time kept back for the judge when deciding on another debate round
  reserve_merge_s: 60          # time kept back for the final merge
  straggler_grace_s: 150       # once one side has answered, how long to wait for the other before going on without it
  fact_grace_s: 30             # the same, once a side has answered a short fact (mode auto): a third model covers the other
  history_char_budget: 24000

  # Comparator and merge are extraction tasks, not reasoning: cheap, fast, thinking minimal.
  utility: {provider: gemini, model: gemini-3.5-flash-lite, effort: "off"}
  utility_fallbacks:
    - {provider: gemini, model: gemini-3.6-flash, effort: low}
    - {provider: groq, model: openai/gpt-oss-120b, effort: low}
    - {provider: claude, model: haiku, effort: low}

  # Judge for conflicts that survive debate: a third model family that argued
  # neither side (GPT-OSS 120B, OpenAI's open-weight model), on Groq's free tier;
  # the same weights on Workers AI when Groq's daily quota runs out. The sides'
  # own families come last: better than no ruling, and the transcript says who
  # judged. The prompt is anonymized and the order shuffled either way.
  judge: {provider: groq, model: openai/gpt-oss-120b, effort: high}
  judge_fallbacks:
    - {provider: workers_ai, model: "@cf/openai/gpt-oss-120b", effort: high}
    - {provider: gemini, model: gemini-3.6-flash, effort: high}
    - {provider: claude, model: sonnet, effort: high}

  # Substitutes for a side whose model fails (after its own retries). A run
  # answered by a substitute is still two-model, and the UI says who stood in.
  fallbacks:
    gemini/gemini-3.8-flash: [{model: gemini-3.6-flash}, {model: gemini-3.5-flash-lite}]
    gemini/gemini-3.6-flash: [{model: gemini-3.5-flash-lite}]
    gemini/gemini-4-argon: [{model: gemini-3.8-flash}]
    claude/opus: [{model: sonnet}]

defaults:
  side_a: {provider: claude, model: sonnet, effort: medium}
  # Side B starts on Gemini 3.6 Flash and moves to 3.8 Flash only while 3.8 is
  # healthy (app/promotion.py): checked every 30 minutes while unused, adopted
  # after 2 passes in a row, dropped at its first failure. 3.8 Flash's free tier
  # allows about 20 requests a day, so there are no checks while it is in use.
  side_b:
    provider: gemini
    model: gemini-3.6-flash
    effort: medium
    prefer: {model: gemini-3.8-flash, check_every_s: 1800, passes: 2, timeout_s: 60}

providers:
  claude:
    label: Claude
    kind: claude_cli
    secret: claude_oauth_token          # from `claude setup-token`: your own subscription, used only by you
    trains_on_data: false
    enabled: true
    timeout_s: 300
    retry: {max_attempts: 2, base_delay_s: 3, max_delay_s: 30}
    circuit: {failure_threshold: 3, cooldown_s: 120, max_cooldown_s: 900}
    models:
      - {id: haiku,  label: "Claude Haiku (fast)"}
      - {id: sonnet, label: "Claude Sonnet"}
      - {id: opus,   label: "Claude Opus (if your plan includes it)"}
      - {id: fable,  label: "Claude Fable (if your plan includes it)"}

  gemini:
    label: Gemini
    kind: gemini_api
    secret: gemini_api_key              # aistudio.google.com; free tier
    trains_on_data: true                # the free API tier may use prompts to improve products
    enabled: true
    timeout_s: 180
    retry: {max_attempts: 3, base_delay_s: 1.5, max_delay_s: 30}
    circuit: {failure_threshold: 3, cooldown_s: 60, max_cooldown_s: 600}
    # thinking_levels: the levels a model accepts; effort is clamped to the nearest one.
    models:
      - {id: gemini-3.8-flash,      label: "Gemini 3.8 Flash",      thinking_levels: [low, medium, high]}
      - {id: gemini-3.6-flash,      label: "Gemini 3.6 Flash",      thinking_levels: [minimal, low, medium, high]}
      - {id: gemini-3.5-flash-lite, label: "Gemini 3.5 Flash-Lite", thinking_levels: [minimal, low, medium, high]}
      - {id: gemini-4-argon,        label: "Gemini 4 Argon (check your AI Studio limits)", thinking_levels: [low, medium, high]}

  # The third family: GPT-OSS 120B. Free tiers (check each console for today's limits):
  # Groq's free plan, and Workers AI's daily free neurons as the fallback.
  groq:
    label: Groq
    kind: openai
    base_url: https://api.groq.com/openai/v1
    secret: groq_api_key                # console.groq.com
    # Groq keeps no inference data by default, apart from abuse logs for up to 30 days;
    # Zero Data Retention (console: Data Controls) drops those too.
    trains_on_data: false
    supports_reasoning_effort: true
    reasoning_efforts: [low, medium, high]   # GPT-OSS can't turn reasoning off: "off" is sent as low
    enabled: true
    timeout_s: 90
    retry: {max_attempts: 3, base_delay_s: 2, max_delay_s: 20}
    circuit: {failure_threshold: 3, cooldown_s: 60, max_cooldown_s: 600}
    models:
      - {id: openai/gpt-oss-120b, label: "GPT-OSS 120B (Groq)"}

  workers_ai:
    label: Workers AI
    kind: openai
    api: responses                      # how Workers AI serves GPT-OSS
    base_url: https://api.cloudflare.com/client/v4/accounts/{cloudflare_account_id}/ai/v1
    secret: cloudflare_ai_token         # a Cloudflare API token with Workers AI permission
    trains_on_data: false               # Cloudflare doesn't train on Workers AI content or keep it
    supports_reasoning_effort: true
    reasoning_efforts: [low, medium, high]
    enabled: true
    timeout_s: 120
    retry: {max_attempts: 2, base_delay_s: 2, max_delay_s: 20}
    circuit: {failure_threshold: 3, cooldown_s: 120, max_cooldown_s: 900}
    models:
      - {id: "@cf/openai/gpt-oss-120b", label: "GPT-OSS 120B (Workers AI)"}

  # An example of one more OpenAI-compatible voice. Model IDs change often:
  # confirm in the provider's console before enabling, and add the key to Vault.
  openrouter:
    label: OpenRouter
    kind: openai
    base_url: https://openrouter.ai/api/v1
    secret: openrouter_api_key
    trains_on_data: false
    enabled: false
    timeout_s: 120
    models:
      - {id: "deepseek/deepseek-r1:free", label: "DeepSeek R1 (free)"}
