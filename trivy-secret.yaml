# Trivy reads this file for its secret scan (its default --secret-config path),
# including the image gate in .github/workflows/pipeline.yml.
#
# The OCI Python SDK's generated "database multicloud" clients carry links to
# Oracle's API reference, and one of them (.../OracleDbAwsKeyPool/...) matches
# Trivy's AWS secret-key rule: the word "AwsKey" followed by 40 characters of
# URL. It is a documentation link, not a credential. Allowed for that SDK
# module only; every other file is still scanned.
allow-rules:
  - id: oci-sdk-dbmulticloud-doc-links
    description: OCI SDK dbmulticloud clients cite API reference URLs containing "AwsKey"
    path: site-packages/oci/dbmulticloud/
